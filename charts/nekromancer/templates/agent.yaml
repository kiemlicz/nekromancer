{{- $osHosts := include "nekromancer.osHosts" . | fromJsonArray }}
{{- if $osHosts }}
{{- if .Values.agent.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nekromancer.serviceAccountName" (dict "root" . "component" "agent") }}
  labels: {{- include "nekromancer.labels" . | nindent 4 }}
---
{{- end }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-agent
  labels: {{- include "nekromancer.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "nekromancer.labels" . | nindent 6 }}
      app.kubernetes.io/component: agent
  {{- with .Values.agent.updateStrategy }}
  updateStrategy: {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels: {{- include "nekromancer.podLabels" (dict "root" . "component" "agent") | nindent 8 }}
      {{- with .Values.agent.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "nekromancer.serviceAccountName" (dict "root" . "component" "agent") }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.agent.podSecurityContext }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      # Only hosts that shut down through it, the rest must not get a second shutdown.
      affinity: {{- include "nekromancer.affinity" (dict "affinity" .Values.agent.affinity "field" "matchFields" "guard" (list (dict "key" "metadata.name" "operator" "In" "values" $osHosts))) | nindent 8 }}
      {{- with .Values.agent.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: agent
        image: {{ include "nekromancer.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["/node-agent"]
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        {{- with .Values.agent.securityContext }}
        securityContext: {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.agent.resources }}
        resources: {{- toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
        - name: system-bus
          mountPath: /run/dbus/system_bus_socket
      volumes:
      - name: system-bus
        hostPath:
          path: {{ .Values.agent.systemBusSocket }}
          type: Socket
{{- end }}
