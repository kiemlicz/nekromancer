{{- $osHosts := include "nekromancer.osHosts" . | fromJsonArray }}
{{- if $osHosts }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-agent
  labels: {{- include "nekromancer.labels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-agent
  labels: {{- include "nekromancer.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "nekromancer.labels" . | nindent 6 }}
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        {{- include "nekromancer.labels" . | nindent 8 }}
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: {{ .Release.Name }}-agent
      hostPID: true
      nodeSelector:
        nekromancer.kiemlicz.github.io/managed: "true"
      # Privileged, so only on hosts that shut down through it.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchFields:
              - key: metadata.name
                operator: In
                values: {{ toJson $osHosts }}
      tolerations:
      - operator: Exists
      containers:
      - name: agent
        image: {{ include "nekromancer.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["/node-agent"]
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        # Entering PID 1's namespaces to run shutdown needs all of this.
        securityContext:
          runAsUser: 0
          privileged: true
          readOnlyRootFilesystem: true
{{- end }}
